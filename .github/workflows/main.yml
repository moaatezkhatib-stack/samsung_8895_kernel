name: Build Kernel
run : |
  export ARCH=arm64
  mkdir -p out

  make 0=out exynos8895_defconfig
  makeout 0=out -j$(nproc)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install packages
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          bc \
          bison \
          flex \
          libssl-dev \
          git

    - name: Build
      run: |
        make -j$(nproc)

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: kernel-output
        path: .
