name: Build A2N Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            python3 \
            zip \
            unzip

      - name: Fix permissions
        run: |
          chmod -R +x toolchain/ || true
          chmod -R +x scripts/ || true
          chmod +x arch/arm64/kernel/vdso/gen_vdso_offsets.sh || true

      - name: Patch DTC yylloc issue
        run: |
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l || true

      - name: Create kernel config
        run: |
          export ANDROID_MAJOR_VERSION=9
          make ARCH=arm64 exynos8895-dreamlte_defconfig

      - name: Build kernel
        run: |
          export ANDROID_MAJOR_VERSION=9
          make ARCH=arm64 -j4

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
            arch/arm64/boot/Image.gz-dtb
